
name: Pruebas backend

on:
  push:
    branches:
      - develop
      - feature/disponibilidad-ejemplares
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bibliotech_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliotech_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: bibliotech_v2/bibliotech_v2

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bibliotech_v2/bibliotech_v2/pom.xml

      - name: Configurar conexión de pruebas
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bibliotech_db" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_USERNAME=postgres" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=ci_password_123" >> "$GITHUB_ENV"

      - name: Ejecutar pruebas Maven
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
